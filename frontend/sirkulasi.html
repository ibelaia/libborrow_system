<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sirkulasi Buku - Lib-Borrow</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --dark-slate: #0f172a;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --bg-card: #ffffff;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: transparent;
            color: var(--text-main);
            padding: 0;
        }

        /* --- Desain Tabel Modern --- */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            padding: 8px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            text-align: left;
        }

        th {
            background-color: #f8fafc;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 16px 20px;
            font-size: 14px;
            color: var(--text-main);
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #f8fafc;
        }

        /* --- Badge Status --- */
        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-success { background-color: #d1fae5; color: #047857; }
        .badge-warning { background-color: #fef3c7; color: #b45309; }
        .badge-info { background: #f1f5f9; color: #475569; padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 12px; }

        /* --- Tombol Aksi --- */
        .btn-kembali {
            background: #dbeafe;
            color: #1d4ed8;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-kembali:hover { background: #bfdbfe; }
        .btn-kembali:disabled { background: #cbd5e1; color: #94a3b8; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>ID Transaksi</th>
                    <th>ID Anggota</th>
                    <th>Judul Buku</th>
                    <th>Tanggal Pinjam</th>
                    <th>Batas Kembali</th>
                    <th>Status</th>
                    <th>Denda</th>
                    <th style="text-align: center;">Aksi</th>
                </tr>
            </thead>
            <tbody id="sirkulasi-list"></tbody>
        </table>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", loadSirkulasi);

        async function loadSirkulasi() {
            const tbody = document.getElementById("sirkulasi-list");
    
            const role = localStorage.getItem("user_role");
            const userId = localStorage.getItem("user_id"); 

            let url = "http://localhost:8080/api/peminjaman";

            if (role === "Admin") {
                url += "?role=Admin";
            } else if (userId) {
                url += `?userId=${userId}`;
            }

            try {
                const response = await fetch(url);
                const daftarSirkulasi = await response.json();

                tbody.innerHTML = "";

                let listData = [];
                if (Array.isArray(daftarSirkulasi)) {
                    listData = daftarSirkulasi;
                } else if (daftarSirkulasi && Array.isArray(daftarSirkulasi.content)) {
                    listData = daftarSirkulasi.content;
                }

                if (listData.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding: 24px; color: var(--text-muted);">Belum ada transaksi peminjaman.</td></tr>`;
                    return;
                }

                listData.forEach(pinjam => {
                    const row = document.createElement("tr");

                    const idAman = pinjam.id || 0;
                    const formatTxId = "TR-2026-" + String(idAman).padStart(3, '0');

                    const statusAman = pinjam.status ? pinjam.status.toString().toLowerCase() : "";
                    const badgeStatus = (statusAman === "dipinjam")
                        ? `<span class="badge badge-warning">Dipinjam</span>`
                        : `<span class="badge badge-success">Selesai</span>`;

                    let jumlahDenda = 0;
                    if (pinjam.denda) {
                        jumlahDenda = typeof pinjam.denda === 'object' ? (pinjam.denda.jumlah || 0) : pinjam.denda;
                    }
                    const infoDenda = `<b>Rp ${jumlahDenda.toLocaleString('id-ID')}</b>`;

                    let aksiKolom = "";
                    if (role === "Admin") {
                        if (statusAman === "dipinjam") {
                            aksiKolom = `<button class="btn-kembali" onclick="prosesPengembalian(${idAman})">Kembalikan</button>`;
                        } else {
                            aksiKolom = `<span class="badge-info">Selesai</span>`;
                        }
                    } else {
                        aksiKolom = `-`;
                    }

                    const noAnggotaAman = (pinjam.user && pinjam.user.noAnggota) ? pinjam.user.noAnggota : 'AG-000';
                    const judulBukuAman = (pinjam.buku && pinjam.buku.judul) ? pinjam.buku.judul : 'Buku Tanpa Judul';
                    const tglPinjamAman = pinjam.tanggalPinjam || '-';
                    const tglKembaliAman = pinjam.batasKembali || '-'; 

                    row.innerHTML = `
                        <td><b>${formatTxId}</b></td>
                        <td><span style="background: #f1f5f9; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 500;">${noAnggotaAman}</span></td>
                        <td style="font-weight: 600; color: var(--dark-slate);">${judulBukuAman}</td>
                        <td>${tglPinjamAman}</td>
                        <td>${tglKembaliAman}</td>
                        <td>${badgeStatus}</td>
                        <td>${infoDenda}</td>
                        <td style="text-align: center;">${aksiKolom}</td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error("Gagal memuat data sirkulasi:", error);
                tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:red; padding: 24px;">Gagal memuat data sirkulasi dari backend.</td></tr>`;
            }
        }

        async function prosesPengembalian(peminjamanId) {
            if (confirm("Apakah Anda yakin ingin memproses pengembalian buku untuk transaksi ini?")) {
                try {
                    const response = await fetch(`http://localhost:8080/api/peminjaman/kembali/${peminjamanId}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });

                    const resultMessage = await response.text();

                    if (response.ok) {
                        alert(resultMessage); 
                        loadSirkulasi(); 
                    } else {
                        alert("Gagal memproses pengembalian: " + (resultMessage || "Terjadi kesalahan pada server."));
                    }
                } catch (error) {
                    console.error("Terjadi kendala jaringan:", error);
                    alert("Tidak dapat terhubung ke server backend.");
                }
            }
        }
    </script>
</body>
</html>
