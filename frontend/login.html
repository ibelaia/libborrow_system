<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lib-Borrow - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --dark-slate: #0f172a;
            --text-main: #334155;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            background: radial-gradient(circle at top right, #1e3a8a, var(--dark-slate));
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .login-card h1 {
            color: var(--dark-slate);
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .login-card p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #f8fafc;
            font-size: 14px;
            transition: all 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Sistem Lib-Borrow</h1>
        <p>Silakan masuk untuk mengakses dasbor</p>
    
        <div class="input-group">
            <label>Alamat Email</label>
            <input type="email" id="email" placeholder="contoh: admin@mail.com">
        </div>
        
        <div class="input-group">
            <label>Kata Sandi</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        
        <button class="btn-submit" onclick="prosesLogin()">Login</button>
    </div>

    <script>
        // Bersihkan sesi saat berada di halaman login
        localStorage.clear();

        async function prosesLogin() {
            const email = document.getElementById("email").value;
            const pass = document.getElementById("password").value;

            if (!email || !pass) {
                alert("Email dan kata sandi tidak boleh kosong!");
                return;
            }

            try {
                const response = await fetch(`http://localhost:8080/api/users/login?email=${email}&password=${pass}`, {
                    method: 'POST'
                });

                if (response.ok) {
                    const user = await response.json();
                    
                    const idYangDidapat = user.id || user.idUser || user.userId;
                    
                    if (!idYangDidapat) {
                        alert("Login sukses, tapi properti ID user tidak ditemukan di database!");
                        return;
                    }
                    
                    const namaLengkap = user.namaLengkap || "Pengguna";

                    // Simpan data ke localStorage
                    localStorage.setItem("user_id", idYangDidapat);
                    localStorage.setItem("user_role", user.role);
                    localStorage.setItem("user_nama", namaLengkap);
                    localStorage.setItem("user_email", user.email);
                    
                    // Masuk ke dashboard
                    window.location.href = "dashboard.html";
                } else {
                    alert("Email atau kata sandi salah!");
                }
            } catch (error) {
                console.error("Error saat login:", error);
                alert("Gagal terhubung ke server backend Spring Boot!");
            }
        }
    </script>
</body>
</html>
